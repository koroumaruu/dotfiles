#Dont forget to run:
#tmux source-file ~/.config/tmux/tmux.conf

# Reload config
unbind r
bind r source-file $HOME/dotfiles/config/tmux/tmux.conf

#Basic stuff
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on 
set -g set-clipboard on

#changes the prefix from Ctrl B to Ctrl A
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# vimbind pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+HJKL to switch panes with C-a
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R


# Split windows 
unbind %
unbind '"'
bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"

# Start off the windows with 1 instead of 0
set -g base-index 1 
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#Alt + Num instead of C-a-num
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


#run C-a-[
# there you will be able to use vimbinds such as shift V, HJKL, and Yank
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Theme Colors for the bottom bar 
thm_bg="#0F0F0F"
thm_fg="#f4decd"
thm_cyan="#71B4D6"
thm_black="#000000"
thm_black2="#0f0f0f"
thm_gray="#2f2f2f"
thm_magenta="#E28DC6"
thm_pink="#F16E65"
thm_red="#F16E65"
thm_green="#AFAF5F"
thm_green2="#7EC9A3"
thm_yellow="#ffc777"
thm_blue="#71B4D6"
thm_orange="#EF934D"


# Status bar settings
set -g status "on"
set -g status-bg "${thm_black2}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

#panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_red}"

# Windows
set -g window-status-activity-style "fg=${thm_blue},bg=${thm_fg},none"
set -g window-status-style "fg=${thm_bg},bg=${thm_bg},none"
set -g window-status-separator ""




#active tabs
# set -g window-status-current-format "#{?window_start_flag,#[fg=${thm_bg}],#[fg=${thm_gray}]}#[bg=${thm_green}]#[fg=${thm_bg},bg=${thm_green},bold] #I  #W#F #{?window_end_flag,#[fg=${thm_green}]#[bg=${thm_bg}],#[fg=${thm_green}]#[bg=${thm_gray}]}"
#incative tabs
# set -g window-status-format "#{?window_start_flag,#[fg=${thm_bg}],#[fg=${thm_gray}]}#[bg=${thm_gray}]#[fg=${thm_fg},bg=${thm_gray}] #I  #W#F "


# ALTERNATIVE LEFT SIDE
# Statusline - left side (Session pill)
set -g status-left-length 100
set -g status-left "#[fg=${thm_fg},bg=${thm_gray},bold] #S #[fg=${thm_gray},bg=${thm_bg},nobold]"
# Statusline - current window (Active tab)
set -g window-status-current-format "#[fg=${thm_bg},bg=${thm_green}]#[fg=${thm_bg},bg=${thm_green},bold] #I  #W#F #[fg=${thm_green},bg=${thm_bg},nobold]"
# Statusline - other windows (inactive tabs)
set -g window-status-format "#[fg=${thm_bg},bg=${thm_gray}]#[fg=${thm_fg},bg=${thm_gray}] #I  #W#F #[fg=${thm_gray},bg=${thm_black}]"


# Statusline - right side
set -g status-right-length 80
set -g status-right "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_green2}],#[fg=${thm_green}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_green2}],#[bg=${thm_green}]}#[fg=${thm_bg}]  #[fg=${thm_gray},bg=${thm_green}]#{?client_prefix,#[bg=${thm_green2}],#[bg=${thm_green}]}#[fg=${thm_fg},bg=${thm_gray}] %I:%M %p "

